{{- /*
PersistentVolumeClaim for uploaded media (Phase 7).

Uploaded images/videos are streamed to MEDIA_DIR on disk (Polyptic does NOT use
object storage) and served back, ungated, from the top-level GET /media/:id.
That directory MUST be durable, so when persistence is enabled we back MEDIA_DIR
with this PVC and mount it into the server pod (see deployment.yaml).

Gated by .Values.media.persistence.enabled. When disabled, the deployment mounts
an emptyDir instead (ephemeral — uploads are lost on pod restart; dev only).

resource-policy: keep prevents `helm uninstall` from deleting operators' uploads.
*/ -}}
{{- if and .Values.media.persistence.enabled (not .Values.media.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "polyptic.media.pvcName" . }}
  labels:
    {{- include "polyptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.media.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.media.persistence.size | quote }}
  {{- if .Values.media.persistence.storageClass }}
  {{- if (eq "-" .Values.media.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.media.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
---
{{- /*
PersistentVolumeClaim for the fleet's logs (POL-187).

Boxes ship their log lines to the control plane and hold them locally until this
server acknowledges them; the server writes them under LOG_DIR as NDJSON, one
directory per machine, one file per UTC day, swept on an age cap AND a
per-machine size cap.

This volume MUST be durable — the whole point of the feature is that a night's
evidence outlives the reboot that used to erase it, and an emptyDir here would
reproduce exactly the failure being fixed.

Point `logs.persistence.storageClass` at an ENCRYPTED class: at-rest encryption
is a storage-layer concern by design (see values.yaml).

resource-policy: keep prevents `helm uninstall` from deleting an investigation
someone is in the middle of.
*/ -}}
{{- if and .Values.logs.persistence.enabled (not .Values.logs.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "polyptic.logs.pvcName" . }}
  labels:
    {{- include "polyptic.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.logs.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.logs.persistence.size | quote }}
  {{- if .Values.logs.persistence.storageClass }}
  {{- if (eq "-" .Values.logs.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.logs.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
